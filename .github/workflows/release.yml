name: Release

on:
  push:
    tags: ['*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: pass
            musl: true

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: pass
            musl: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pass.exe
            linker: link.exe

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: pass.exe
            linker: link.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pass

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: pass

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.linker }}
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.linker }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir release
          cp artifacts/pass-x86_64-unknown-linux-musl/pass        release/pass-linux-x86_64
          cp artifacts/pass-aarch64-unknown-linux-musl/pass        release/pass-linux-arm64
          cp artifacts/pass-x86_64-pc-windows-msvc/pass.exe       release/pass-windows-x86_64.exe
          cp artifacts/pass-aarch64-pc-windows-msvc/pass.exe      release/pass-windows-arm64.exe
          cp artifacts/pass-aarch64-apple-darwin/pass              release/pass-macos-arm64
          cp artifacts/pass-x86_64-apple-darwin/pass              release/pass-macos-x86_64
          chmod +x release/pass-linux-* release/pass-macos-*

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
