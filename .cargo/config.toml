[target.x86_64-pc-windows-msvc]
# Git for Windows ships link.exe that shadows MSVC's linker. CI resolves this
# dynamically via vswhere (see .github/workflows). For local builds, set this
# to the path printed by:
#   & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\*\bin\HostX64\x64\link.exe"
linker = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.40.33807\\bin\\Hostx64\\x64\\link.exe"
